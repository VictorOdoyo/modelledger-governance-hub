[project]
name = "modelledger-governance-hub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
 "fastapi>=0.141,<1", "uvicorn>=0.52,<1", "sqlalchemy>=2.0.52,<2.1",
 "psycopg[binary]>=3.2,<4", "alembic>=1.19,<2", "pydantic-settings>=2.15,<3",
 "celery[redis]>=5.6,<6", "boto3>=1.40,<2", "httpx>=0.28,<1",
 "pyjwt>=2.13,<3", "pwdlib[argon2]>=0.3,<1", "python-multipart>=0.0.32,<1",
 "prometheus-client>=0.26,<1"
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.16,<1"]
integrations = ["mlflow-skinny>=3.6,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
