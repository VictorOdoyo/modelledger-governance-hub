apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelledger-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelledger-api
  template:
    metadata:
      labels:
        app: modelledger-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/modelledger-api:latest
          ports:
            - containerPort: 8088
          envFrom:
            - secretRef:
                name: modelledger-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
