apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelledger-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelledger-worker
  template:
    metadata:
      labels:
        app: modelledger-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/modelledger-api:latest
          command: ["uv", "run", "celery", "-A", "modelledger.tasks:celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - secretRef:
                name: modelledger-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
